<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Commons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:#121826;color:#FCFBF8;
    font-family:'Inter',-apple-system,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:8vh 7vw;min-height:100vh;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(120% 90% at 50% 8%,rgba(65,105,255,.10),transparent 60%);}

  .fade{opacity:0;transform:translateY(14px);transition:opacity 1.1s ease,transform 1.1s ease;}
  .fade.in{opacity:1;transform:none;}

  .nbar{width:54px;height:5px;background:#C6FF00;border-radius:2px;margin-bottom:2.4rem;}

  .wordmark{font-size:clamp(2.9rem,9.5vw,6.6rem);font-weight:900;letter-spacing:-.025em;line-height:.92;}

  .tag{margin-top:1.7rem;font-size:clamp(.82rem,2.1vw,1.3rem);font-weight:600;
    text-transform:uppercase;letter-spacing:.17em;line-height:1.5;color:#C6C1B6;max-width:20ch;}

  .enter{position:fixed;top:1.4rem;right:1.7rem;z-index:10;}
  .pbtn{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;
    color:#6b7180;text-decoration:none;transition:color .3s;}
  .pbtn:hover{color:#C6FF00;}
</style>
</head>
<body>
  <div class="nbar fade" id="nbar"></div>
  <h1 class="wordmark fade" id="word">The Commons</h1>
  <p class="tag fade" id="tag">Everyone has a story to tell through food</p>

  <div class="enter fade" id="enter">
    <a class="pbtn" href="the_commons_landing_v11.html">Partners</a>
  </div>

<script>
  const seq=[['nbar',250],['word',500],['tag',950],['enter',1700]];
  seq.forEach(([id,t])=>setTimeout(()=>document.getElementById(id).classList.add('in'),t));
</script>
</body>
</html>
